name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Setup
        run: flutter create . --platforms android --project-name k_pdf_reader --org com.example.k

      - name: Install Dependencies
        # Must run FIRST to download the plugin files into the runner cache
        run: flutter pub get

      - name: Hard-Patch SDK 36 Across All Plugins
        # Finds every downloaded plugin file and forcibly overwrites SDK limits to 36
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' {} + || true
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} + || true
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} + || true
          
          find /opt/hostedtoolcache/flutter -type f -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' {} + || true
          find /opt/hostedtoolcache/flutter -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} + || true
          find /opt/hostedtoolcache/flutter -type f -name "build.gradle*" -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} + || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
