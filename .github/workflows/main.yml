name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Setup
        run: flutter create . --platforms android --project-name k_pdf_reader --org com.example.k

      - name: Inject Android SDK 36 Override Globally
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          
          cat << 'EOF' > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }

          subprojects {
              plugins.withId("com.android.library") {
                  configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.application") {
                  configure<com.android.build.gradle.AppExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
