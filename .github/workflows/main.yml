name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Setup
        run: flutter create . --platforms android --project-name k_pdf_reader --org com.example.k

      - name: Configure Global SDK Properties
        # Sets the target versions natively so plugins read them automatically
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          
          # Only patch the main app module
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
