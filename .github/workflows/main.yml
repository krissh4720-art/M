name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Setup
        run: flutter create . --platforms android --project-name k_pdf_reader --org com.example.k

      - name: Inject SDK 36 Globally Across All Modules
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          
          # Patch app-level build.gradle.kts
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          
          # Append universal resolution strategy for all subprojects/plugins
          cat << 'EOF' >> android/app/build.gradle.kts

          gradle.projectsEvaluated {
              subprojects {
                  if (project.hasProperty("android")) {
                      val android = project.extensions.findByName("android")
                      if (android is com.android.build.gradle.BaseExtension) {
                          android.compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
